# Smoke flow for a dev client or release build with the app installed.
appId: com.codebyramiz.hnreader
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: story-item-0
    timeout: 30000
- scroll
- scroll
- scrollUntilVisible:
    element:
      id: story-item-0
    direction: UP
- tapOn:
    id: story-item-0
- extendedWaitUntil:
    visible:
      id: bookmark-button
    timeout: 20000
- tapOn:
    id: bookmark-button
- assertVisible: Saved
# Maestro's `back` is a no-op on iOS, so tap the native header back button there.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: BackButton
- runFlow:
    when:
      platform: Android
    commands:
      - back
- tapOn:
    id: tab-bookmarks
# The bookmarks screen has its own list id and must not show the empty state.
- assertVisible:
    id: bookmarks-list
- assertNotVisible: No bookmarks yet
