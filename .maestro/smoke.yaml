# Smoke flow for a dev client or release build with the app installed.
appId: com.codebyramiz.hnreader
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: story-item-0
    timeout: 30000
- scroll
- scroll
- scrollUntilVisible:
    element:
      id: story-item-0
    direction: UP
- tapOn:
    id: story-item-0
# Long text posts push the button below the fold, so scroll to it.
- scrollUntilVisible:
    element:
      id: bookmark-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: bookmark-button
- assertVisible: Saved
# Saved stories take notes; they go to the outbox and sync in the background.
- scrollUntilVisible:
    element:
      id: note-body-input
    direction: DOWN
- tapOn:
    id: note-body-input
- inputText: Smoke note
- hideKeyboard
- tapOn:
    id: note-save
- assertVisible: Smoke note
# Maestro's `back` is a no-op on iOS, so tap the native header back button there.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: BackButton
- runFlow:
    when:
      platform: Android
    commands:
      - back
# Swipe right on a row to save it without opening the story.
- swipe:
    from:
      id: story-item-1
    direction: RIGHT
- tapOn:
    id: tab-bookmarks
# The bookmarks screen has its own list id and must not show the empty state.
- assertVisible:
    id: bookmarks-list
- assertNotVisible: No bookmarks yet
# Deep link straight into a story (item 1 is the first HN story, it never goes away).
- openLink: hnreader://story/1
- extendedWaitUntil:
    visible:
      id: story-detail
    timeout: 20000
